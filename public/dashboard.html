<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GGC Sovereign Organism — Dashboard</title>
  <script type="module">
    import { initDashboard } from './click.js';
    initDashboard();
  </script>
  <style>
    :root {
      --bg: #07080a;
      --fg: #e8e9ed;
      --muted: #8b909a;
      --line: rgba(232, 233, 237, 0.12);
      --silver: #c5ccd6;
      --warn: #c4a574;
      --ok: #8aa58a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
    .kicker { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    h1 { font-weight: 500; letter-spacing: -0.04em; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 12px 0 8px; }
    p, li { color: var(--muted); line-height: 1.55; }
    #status {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--warn);
      margin: 16px 0 24px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .card h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .card strong { font-size: 1.35rem; font-weight: 500; letter-spacing: -0.03em; }
    a { color: var(--silver); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <main>
    <div class="kicker">GGC-DAILY-5X-001 · Dashboard · 25 Sep 2026</div>
    <h1>Sovereign organism</h1>
    <div id="status">SYSTEM: INITIALIZING...</div>
    <div class="grid">
      <div class="card"><h2>Mesh</h2><strong>88%</strong><p>7 of 8 public surfaces</p></div>
      <div class="card"><h2>Frequency</h2><strong>5X · 1.500</strong><p>Phase aligned CDT</p></div>
      <div class="card"><h2>Silver Umbrella</h2><strong>Raised</strong><p>Declared — not probeable</p></div>
      <div class="card"><h2>Motherbot</h2><strong>Dark</strong><p>Railway station 404</p></div>
    </div>
    <p style="margin-top:28px"><a href="/pulse">Open sovereignty report</a> · <a href="/ggc_ledger.json">Ledger</a> · <a href="/">Edge</a></p>
  </main>
</body>
</html>
